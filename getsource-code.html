body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% 30%,rgba(5,5,7,.25),rgba(5,5,7,.9))}
a{color:inherit;text-decoration:none}
.glass{position:relative;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 50px -18px rgba(0,0,0,.85)}
.top{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border-radius:999px;max-width:calc(100vw - 20px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;padding-right:8px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.top nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.top nav::-webkit-scrollbar{display:none}
.top nav a{padding:9px 14px;border-radius:999px;font-size:.8rem;font-weight:600;color:#c9c3c6;white-space:nowrap;transition:.25s}
.top nav a:hover{color:#fff}.top nav a.on{background:linear-gradient(135deg,var(--ac),#a1122b);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:4vh 18px 8vh}
h1.t{font:800 clamp(2.2rem,6vw,4rem)/1.05 Poppins,Inter,sans-serif;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffb3be);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{margin:10px 0 26px;color:#b9aaae;max-width:640px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:600 .88rem Inter,sans-serif;cursor:pointer;transition:.25s}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#a1122b);border-color:transparent;box-shadow:0 10px 26px -10px var(--ac)}
.ft{text-align:center;padding:4vh 18px 6vh;color:#85777b;font-size:.82rem}
.ft .ic{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.ft .ic a{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:18px;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12);transition:.25s}
.ft .ic a:hover{color:var(--c);border-color:var(--c);box-shadow:0 0 20px -4px var(--c)}
.ft .tt:hover{color:#fff;text-shadow:-2px -2px 0 #25f4ee,2px 2px 0 #fe2c55}
@media(max-width:640px){.brand b{display:none}}
.bx{display:flex;gap:10px;padding:12px;flex-wrap:wrap}
.bx input{flex:1;min-width:200px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;padding:13px 16px;font:500 .95rem Inter,sans-serif;outline:0}
.bx input:focus{border-color:var(--ac)}
.pn{margin-top:18px;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tabs .btn.on{background:rgba(255,255,255,.2)}
pre{max-height:520px;overflow:auto;background:rgba(0,0,0,.5);border-radius:14px;padding:16px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#ecdfe2;white-space:pre}
.as{display:grid;gap:6px;max-height:520px;overflow:auto}
.ar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.82rem}

<script>var $=function(i){return document.getElementById(i)},html='',base='',files=[];
var PX=[function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},function(u){return 'https://corsproxy.io/?'+encodeURIComponent(u)},function(u){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)}];
async function get(u,bin){for(var i=0;i<PX.length;i++){try{var r=await fetch(PX[i](u),{signal:AbortSignal.timeout(20000)});if(r.ok)return bin?await r.blob():await r.text()}catch(e){}}throw new Error('fetch failed')}
function save(b,n){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function nameOf(u,t,i){try{var p=new URL(u).pathname.split('/').filter(Boolean).pop()||'';if(p&&p.indexOf('.')>0)return p.slice(-80)}catch(e){}return t+'-'+i+(t==='css'?'.css':t==='js'?'.js':'')}
function collect(doc){var out=[],seen={};function add(s,t){if(!s||/^(data:|blob:|javascript:|#)/i.test(s))return;try{var u=new URL(s,base).href;if(!seen[u]){seen[u]=1;out.push({url:u,type:t,name:nameOf(u,t,out.length+1)})}}catch(e){}}
 doc.querySelectorAll('link[rel~=stylesheet]').forEach(function(e){add(e.getAttribute('href'),'css')});
 doc.querySelectorAll('script[src]').forEach(function(e){add(e.getAttribute('src'),'js')});
 doc.querySelectorAll('img[src],source[src],video[src],audio[src]').forEach(function(e){add(e.getAttribute('src'),'media')});
 doc.querySelectorAll('link[rel~=icon]').forEach(function(e){add(e.getAttribute('href'),'other')});return out}
function tab(n){$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);$('code').hidden=n!==1;$('as').hidden=n!==2}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
$('go').onclick=async function(){
 var u=$('u').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;base=u;
 $('msg').textContent='Fetching source…';$('out').hidden=true;
 try{html=await get(u);files=collect(new DOMParser().parseFromString(html,'text/html'));
  $('code').textContent=html;$('n').textContent='('+files.length+')';
  $('as').innerHTML=files.map(function(f,i){return '<div class="ar"><input type="checkbox" checked data-i="'+i+'"><span title="'+f.url.replace(/"/g,'&quot;')+'">'+f.name+'</span><em class="tg">'+f.type+'</em><button class="btn" data-s="'+i+'">Save</button></div>'}).join('')||'<div class="msg">No linked files were found.</div>';
  $('out').hidden=false;tab(1);$('msg').textContent='Done. '+files.length+' linked file(s) found.'}
 catch(e){$('msg').textContent='Could not fetch this address. Check the link and try again.'}};
$('u').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('as').addEventListener('click',async function(e){var b=e.target.closest('button[data-s]');if(!b)return;var f=files[b.dataset.s];b.textContent='…';
 try{save(await get(f.url,true),f.name);b.textContent='Saved'}catch(x){b.textContent='Failed'}});
$('dlh').onclick=function(){save(new Blob([html],{type:'text/html'}),'index.html')};
$('cph').onclick=function(){var d=function(){$('msg').textContent='HTML copied.'};if(navigator.clipboard)navigator.clipboard.writeText(html).then(d,d);else{var a=document.createElement('textarea');a.value=html;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();d()}};
$('zip').onclick=async function(){
 if(!window.JSZip){$('msg').textContent='ZIP library failed to load.';return}
 var z=new JSZip(),sel=[].slice.call(document.querySelectorAll('#as input:checked')).map(function(c){return files[c.dataset.i]}),used={},k=0;
 z.file('index.html',html);
 for(var i=0;i<sel.length;i++){var f=sel[i];$('msg').textContent='Downloading '+(i+1)+' / '+sel.length+'…';
  try{var b=await get(f.url,true),n=f.name;if(used[f.type+n]){n=(++k)+'-'+n}used[f.type+n]=1;z.file(f.type+'/'+n,b)}catch(e){}}
 $('msg').textContent='Building ZIP…';save(await z.generateAsync({type:'blob'}),'source.zip');$('msg').textContent='ZIP ready.'};</script></body></html>
