body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% 30%,rgba(5,5,7,.25),rgba(5,5,7,.9))}
a{color:inherit;text-decoration:none}
.glass{position:relative;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 50px -18px rgba(0,0,0,.85)}
.top{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border-radius:999px;max-width:calc(100vw - 20px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;padding-right:8px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.top nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.top nav::-webkit-scrollbar{display:none}
.top nav a{padding:9px 14px;border-radius:999px;font-size:.8rem;font-weight:600;color:#c9c3c6;white-space:nowrap;transition:.25s}
.top nav a:hover{color:#fff}.top nav a.on{background:linear-gradient(135deg,var(--ac),#a1122b);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:4vh 18px 8vh}
h1.t{font:800 clamp(2.2rem,6vw,4rem)/1.05 Poppins,Inter,sans-serif;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffb3be);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{margin:10px 0 26px;color:#b9aaae;max-width:640px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:600 .88rem Inter,sans-serif;cursor:pointer;transition:.25s}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#a1122b);border-color:transparent;box-shadow:0 10px 26px -10px var(--ac)}
.ft{text-align:center;padding:4vh 18px 6vh;color:#85777b;font-size:.82rem}
.ft .ic{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.ft .ic a{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:18px;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12);transition:.25s}
.ft .ic a:hover{color:var(--c);border-color:var(--c);box-shadow:0 0 20px -4px var(--c)}
.ft .tt:hover{color:#fff;text-shadow:-2px -2px 0 #25f4ee,2px 2px 0 #fe2c55}
@media(max-width:640px){.brand b{display:none}}
.gm{display:grid;grid-template-columns:230px 360px 1fr;height:calc(100vh - 210px);min-height:520px;overflow:hidden}
.gm aside{padding:16px;border-right:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.compose{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:16px;background:#c2e7ff;color:#001d35;font:600 .92rem Inter,sans-serif;border:0;cursor:pointer;margin-bottom:10px}
.fl{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:999px;color:#d7cfd1;font-size:.9rem;cursor:pointer}
.fl.on{background:rgba(194,231,255,.18);color:#fff;font-weight:600}.fl:hover{background:rgba(255,255,255,.08)}.fl span{margin-left:auto;font-size:.78rem}
.lst{display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1);min-width:0}
.lb{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:.8rem;color:#cbbec1;word-break:break-all}.lb b{display:block;color:#fff;font-size:.95rem}
.pv{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:8px;background:rgba(255,61,90,.3);font-size:.7rem;color:#fff}
#list{overflow:auto;flex:1}
.mi{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.mi:hover,.mi.on{background:rgba(255,255,255,.08)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.mt{min-width:0;flex:1}.mt b,.mt i,.mt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt i{font-style:normal;font-size:.85rem;color:#e9dfe1}.mt span{font-size:.8rem;color:#a99a9e}.mi.un .mt b,.mi.un .mt i{font-weight:700;color:#fff}
.mi time{font-size:.72rem;color:#a99a9e;flex:none}
.rd{display:flex;flex-direction:column;min-width:0}
.rh{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.1)}.rh h2{font:600 1.25rem Poppins,Inter,sans-serif;word-break:break-word;margin-top:12px}.rh small{color:#b9aaae;display:block;margin-top:6px;word-break:break-all}
.rh .btn{padding:8px 14px;margin-right:6px}
.rb{flex:1;background:#fff;margin:14px;border-radius:14px;overflow:hidden}.rb iframe{width:100%;height:100%;border:0}
.em{margin:auto;color:#a99a9e;text-align:center;padding:30px;line-height:1.6}.bk{display:none}
.dlg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:16px}.dlg[hidden]{display:none}
.dc{width:min(480px,100%);padding:24px;max-height:92vh;overflow:auto;background:rgba(18,12,16,.92)}
.dc h2{font:700 1.3rem Poppins,Inter,sans-serif;margin-bottom:4px}.dc label{display:block;margin:14px 0 6px;font-size:.82rem;color:#cbbec1}
.dc select,.dc input{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:12px 14px;font:500 .92rem Inter,sans-serif;outline:0}

<script>var $=function(i){return document.getElementById(i)},S=null,cur=null,busy=false,H=[],HID={};
var GM='https://api.guerrillamail.com/ajax.php',MTM='https://api.mail.tm',SEC='https://www.1secmail.com/api/v1/',NM={mtm:'mail.tm','1sec':'1secmail',gm:'GuerrillaMail'},EMPTY='<div class="em">Select an email to read it.</div>';
try{H=JSON.parse(localStorage.getItem('tmh'))||[];HID=JSON.parse(localStorage.getItem('tmx'))||{}}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rnd(n){var c='abcdefghijkmnpqrstuvwxyz23456789',a=crypto.getRandomValues(new Uint8Array(n));return Array.prototype.map.call(a,function(b){return c[b%32]}).join('')}
function tmo(p){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error('timeout'))},10000)})])}
function mtm(path,o){o=o||{};var h={'Content-Type':'application/json'};if(S&&S.mode==='mtm'&&S.token&&!o.anon)h.Authorization='Bearer '+S.token;
 return tmo(fetch(MTM+path,{method:o.method||'GET',headers:h,body:o.body})).then(function(r){if(r.status===204)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function gm(p){return new Promise(function(res,rej){var cb='gm'+rnd(8),s=document.createElement('script'),t=setTimeout(function(){end();rej(new Error('timeout'))},10000);
 function end(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=function(d){end();res(d)};s.onerror=function(){end();rej(new Error('failed'))};
 var q=new URLSearchParams(Object.assign({},p,{ip:'127.0.0.1',agent:'error_tempmail',callback:cb,_:Date.now()}));if(S&&S.sid)q.set('sid_token',S.sid);
 s.src=GM+'?'+q;document.head.appendChild(s)})}
function sec(q){return tmo(fetch(SEC+'?'+new URLSearchParams(q))).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function domains(m){
 if(m==='mtm')return mtm('/domains',{anon:1}).then(function(d){return (d['hydra:member']||d).filter(function(x){return x.isActive!==false}).map(function(x){return x.domain})});
 if(m==='1sec')return sec({action:'getDomainList'}).catch(function(){return['1secmail.com','1secmail.org','1secmail.net']});
 return Promise.resolve(['guerrillamail.com'])}
function create(m,user,dom){
 var u=(user||'').toLowerCase().replace(/[^a-z0-9._-]/g,'')||'error'+rnd(7);
 if(m==='mtm'){var a=u+'@'+dom,pw=rnd(14)+'A1!';
  return mtm('/accounts',{method:'POST',body:JSON.stringify({address:a,password:pw}),anon:1}).then(function(){return mtm('/token',{method:'POST',body:JSON.stringify({address:a,password:pw}),anon:1})}).then(function(t){return{addr:a,mode:'mtm',token:t.token}})}
 if(m==='1sec')return Promise.resolve({addr:u+'@'+dom,mode:'1sec',login:u,domain:dom});
 S=null;return gm({f:'get_email_address',lang:'en'}).then(function(d){var sid=d.sid_token;S={sid:sid};return(user?gm({f:'set_email_user',email_user:u,lang:'en'}):Promise.resolve(d)).then(function(r){return{addr:r.email_addr,mode:'gm',sid:sid}})})}
function auto(user){return['mtm','gm','1sec'].reduce(function(p,m){return p.catch(function(){return domains(m).then(function(d){return create(m,user,d[0])})})},Promise.reject())}
function list(){
 if(S.mode==='mtm')return mtm('/messages?page=1').then(function(d){return(d['hydra:member']||[]).map(function(x){return{id:x.id,n:(x.from&&(x.from.name||x.from.address))||'Unknown',s:x.subject,i:x.intro,t:new Date(x.createdAt),u:!x.seen}})});
 if(S.mode==='1sec')return sec({action:'getMessages',login:S.login,domain:S.domain}).then(function(a){return a.filter(function(x){return!HID[S.addr+x.id]}).map(function(x){return{id:x.id,n:x.from,s:x.subject,i:'',t:new Date(String(x.date).replace(' ','T')+'Z'),u:false}})});
 return gm({f:'check_email',seq:0}).then(function(d){return(d.list||[]).map(function(x){return{id:x.mail_id,n:x.mail_from,s:x.mail_subject,i:x.mail_excerpt,t:new Date(Number(x.mail_timestamp)*1000),u:x.mail_read=='0'}})})}
function read(id){
 if(S.mode==='mtm')return mtm('/messages/'+id).then(function(m){var f=m.from||{};return{n:(f.name?f.name+' ':'')+'<'+(f.address||'')+'>',s:m.subject,t:new Date(m.createdAt),h:(m.html&&m.html[0])||'',x:m.text||''}});
 if(S.mode==='1sec')return sec({action:'readMessage',login:S.login,domain:S.domain,id:id}).then(function(m){return{n:m.from,s:m.subject,t:new Date(String(m.date).replace(' ','T')+'Z'),h:m.htmlBody||'',x:m.textBody||m.body||''}});
 return gm({f:'fetch_email',email_id:id}).then(function(d){return{n:d.mail_from,s:d.mail_subject,t:new Date(Number(d.mail_timestamp)*1000),h:d.mail_body||'',x:''}})}
function del(id){
 if(S.mode==='mtm')return mtm('/messages/'+id,{method:'DELETE'});
 if(S.mode==='gm')return gm({f:'del_email','email_addr[]':id});
 HID[S.addr+id]=1;localStorage.setItem('tmx',JSON.stringify(HID));return Promise.resolve()}
function load(){
 if(!S||busy)return Promise.resolve();busy=true;$('st').textContent='Refreshing…';
 return list().then(function(m){$('cnt').textContent=m.length||'';$('st').textContent='Updated '+new Date().toLocaleTimeString();
  $('list').innerHTML=m.length?m.map(function(x){var n=String(x.n||'?');
   return'<div class="mi'+(x.u?' un':'')+(cur===x.id?' on':'')+'" data-id="'+esc(x.id)+'"><div class="av" style="background:hsl('+(n.charCodeAt(0)*37%360)+',55%,42%)">'+esc(n[0].toUpperCase())+'</div><div class="mt"><b>'+esc(n)+'</b><i>'+esc(x.s||'(no subject)')+'</i><span>'+esc(x.i)+'</span></div><time>'+x.t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</time></div>'}).join(''):'<div class="em">Your inbox is empty.<br>Emails sent to this address will appear here.</div>'})
 .catch(function(){$('st').textContent='Connection problem. Retrying…'}).then(function(){busy=false})}
function show(id){cur=id;
 read(id).then(function(m){
  $('rd').innerHTML='<div class="rh"><button class="btn bk" id="bk"><i class="fa-solid fa-arrow-left"></i></button><button class="btn" id="dl"><i class="fa-regular fa-trash-can"></i> Delete</button><h2>'+esc(m.s||'(no subject)')+'</h2><small>From '+esc(m.n)+' &middot; '+m.t.toLocaleString()+'</small></div><div class="rb"><iframe sandbox="allow-popups" referrerpolicy="no-referrer"></iframe></div>';
  $('rd').querySelector('iframe').srcdoc='<base target="_blank"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;color:#202124;margin:16px;word-break:break-word}img{max-width:100%;height:auto}</style>'+(m.h||'<pre style="white-space:pre-wrap">'+esc(m.x)+'</pre>');
  $('gm').classList.add('open');$('bk').onclick=function(){$('gm').classList.remove('open')};
  $('dl').onclick=function(){del(id).then(function(){cur=null;$('rd').innerHTML=EMPTY;$('gm').classList.remove('open');load()})};load()})}
function hist(s){H=H.filter(function(x){return x.addr!==s.addr});H.unshift(s);H=H.slice(0,15);localStorage.setItem('tmh',JSON.stringify(H))}
function begin(s){S=s;cur=null;hist(s);$('ad').textContent=s.addr;$('pv').textContent=NM[s.mode];$('pv').hidden=false;$('rd').innerHTML=EMPTY;dlg(false);return load()}
function dlg(on){$('dlg').hidden=!on;if(on){$('dmsg').textContent='';drawH();fillDom()}}
function drawH(){$('hl').innerHTML=H.length?H.map(function(h,i){return'<div class="hi" data-i="'+i+'"><i class="fa-regular fa-envelope"></i><span>'+esc(h.addr)+'</span><em style="font-style:normal;font-size:.72rem;color:#a99a9e">'+NM[h.mode]+'</em></div>'}).join(''):'<div style="color:#a99a9e;font-size:.84rem">No saved addresses yet.</div>'}
function fillDom(){var m=$('pvs').value,d=$('dm');
 if(m==='auto'){d.innerHTML='<option>Automatic</option>';d.disabled=true;return}
 d.disabled=false;d.innerHTML='<option>Loading…</option>';
 domains(m).then(function(a){d.innerHTML=a.map(function(x){return'<option>'+esc(x)+'</option>'}).join('')}).catch(function(){d.innerHTML='<option value="">Could not load domains</option>'})}
